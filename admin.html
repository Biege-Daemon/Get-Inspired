<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Get Inspired</title>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:'Quicksand',sans-serif;background:#F6F3F2;color:#151515;min-height:100vh;}
a{text-decoration:none;color:inherit;}

/* ── LOCK SCREEN ── */
#lockScreen{position:fixed;inset:0;background:#F6F3F2;display:flex;align-items:center;justify-content:center;z-index:9999;}
.lock-box{width:100%;max-width:360px;padding:0 24px;text-align:center;}
.lock-logo{font-family:'Fjalla One',sans-serif;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:rgba(76,59,55,0.5);margin-bottom:40px;}
.lock-title{font-family:'Fjalla One',sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:2px;color:#151515;margin-bottom:8px;}
.lock-sub{font-size:13px;color:rgba(0,0,0,0.45);margin-bottom:32px;letter-spacing:0.5px;}
.lock-input{width:100%;background:#fff;border:1px solid rgba(0,0,0,0.15);color:#151515;font-family:'Quicksand',sans-serif;font-size:15px;font-weight:600;padding:14px 18px;letter-spacing:2px;outline:none;text-align:center;transition:border-color 0.2s;margin-bottom:12px;}
.lock-input:focus{border-color:#4C3B37;}
.lock-btn{width:100%;padding:14px;background:#4C3B37;color:#fff;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:3px;border:none;cursor:pointer;transition:background 0.2s;}
.lock-btn:hover{background:#5c4840;}
.lock-error{font-size:12px;color:#c0392b;margin-top:10px;min-height:18px;letter-spacing:0.5px;}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh;}
.top-bar{background:#fff;border-bottom:1px solid rgba(0,0,0,0.08);padding:0 40px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.top-bar-brand{font-family:'Fjalla One',sans-serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(76,59,55,0.6);}
.top-bar-right{display:flex;align-items:center;gap:20px;}
.top-bar-status{font-size:11px;color:rgba(0,0,0,0.4);letter-spacing:0.5px;}
.top-bar-site{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:rgba(0,0,0,0.5);padding:6px 14px;border:1px solid rgba(0,0,0,0.15);transition:all 0.2s;cursor:pointer;}
.top-bar-site:hover{border-color:rgba(0,0,0,0.35);color:#151515;}

.main{display:grid;grid-template-columns:260px 1fr 320px;min-height:calc(100vh - 56px);}

/* ── LEFT SIDEBAR ── */
.sidebar{background:#FAF8F7;border-right:1px solid rgba(0,0,0,0.07);padding:32px 0;}
.sidebar-section{margin-bottom:32px;}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:rgba(0,0,0,0.35);padding:0 24px;margin-bottom:12px;display:block;}
.post-list{display:flex;flex-direction:column;}
.post-item{padding:12px 24px;cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;}
.post-item:hover{background:rgba(0,0,0,0.03);}
.post-item.active{background:rgba(76,59,55,0.12);border-left-color:#4C3B37;}
.post-item-title{font-size:13px;font-weight:600;color:#151515;margin-bottom:3px;line-height:1.3;}
.post-item-meta{font-size:11px;color:rgba(0,0,0,0.4);display:flex;gap:8px;}
.post-item-cat{background:rgba(0,0,0,0.07);padding:1px 6px;border-radius:2px;}
.new-post-btn{display:flex;align-items:center;gap:8px;margin:0 24px;padding:10px 16px;background:rgba(76,59,55,0.1);border:1px solid rgba(76,59,55,0.4);color:#4C3B37;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:all 0.2s;width:calc(100% - 48px);}
.new-post-btn:hover{background:rgba(76,59,55,0.18);}
.new-post-btn svg{flex-shrink:0;}

/* ── EDITOR ── */
.editor{padding:40px 48px;overflow-y:auto;max-height:calc(100vh - 56px);}
.editor-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:rgba(0,0,0,0.35);margin-bottom:24px;display:block;}
.field{margin-bottom:24px;}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2.5px;color:rgba(0,0,0,0.55);display:block;margin-bottom:8px;}
.field-hint{color:rgba(0,0,0,0.35);font-size:10px;text-transform:none;letter-spacing:0;font-weight:400;}
.field-input{width:100%;background:#fff;border:1px solid rgba(0,0,0,0.15);color:#151515;font-family:'Quicksand',sans-serif;font-size:15px;font-weight:500;padding:12px 16px;outline:none;resize:none;transition:border-color 0.2s;line-height:1.5;}
.field-input:focus{border-color:#4C3B37;}
.field-input.title-input{font-family:'Fjalla One',sans-serif;font-size:22px;letter-spacing:1px;}
.rich-toolbar{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;}
.rich-btn{background:#fff;border:1px solid rgba(0,0,0,0.15);color:rgba(0,0,0,0.55);font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer;transition:all 0.15s;line-height:1;}
.rich-btn:hover{background:rgba(0,0,0,0.05);color:#151515;}
.rich-btn.active{background:#4C3B37;border-color:#4C3B37;color:#fff;}
.rich-editor{width:100%;min-height:300px;background:#fff;border:1px solid rgba(0,0,0,0.15);color:#151515;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:500;padding:12px 16px;outline:none;line-height:1.8;transition:border-color 0.2s;}
.rich-editor:focus{border-color:#4C3B37;}
.rich-editor p{margin-bottom:10px;}
.rich-editor p:last-child{margin-bottom:0;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cats-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.cat-chip{padding:6px 14px;border:1px solid rgba(0,0,0,0.18);font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(0,0,0,0.55);cursor:pointer;transition:all 0.15s;background:#fff;}
.cat-chip.selected{background:#4C3B37;border-color:#4C3B37;color:#fff;}
.cat-chip-add{padding:6px 14px;border:1px dashed rgba(0,0,0,0.2);font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(0,0,0,0.35);cursor:pointer;background:none;transition:all 0.15s;}
.cat-chip-add:hover{border-color:rgba(0,0,0,0.45);color:rgba(0,0,0,0.65);}
.cat-new-input{background:#fff;border:1px solid rgba(76,59,55,0.5);color:#151515;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:6px 12px;outline:none;width:120px;}
.slug-preview{font-size:11px;color:rgba(0,0,0,0.35);margin-top:6px;font-family:monospace;letter-spacing:0.5px;}
.slug-preview span{color:#4C3B37;}

/* ── IMAGE UPLOAD ── */
.img-upload-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.upload-btn{display:inline-block;padding:10px 18px;background:#fff;border:1px solid rgba(0,0,0,0.18);color:#4C3B37;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;transition:all 0.15s;}
.upload-btn:hover{border-color:#4C3B37;background:rgba(76,59,55,0.05);}
.upload-hint{font-size:12px;color:rgba(0,0,0,0.4);}
.upload-note{font-size:11px;color:rgba(0,0,0,0.3);margin-top:6px;display:block;}
.img-preview-wrap{display:flex;align-items:center;gap:14px;margin-top:14px;}
.img-preview-thumb{width:150px;height:94px;object-fit:cover;border:1px solid rgba(0,0,0,0.12);background:#eee;flex-shrink:0;}
.img-remove-btn{background:none;border:none;color:#c0392b;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;padding:0;}
.img-remove-btn:hover{text-decoration:underline;}

/* ── PREVIEW PANEL ── */
.preview-panel{background:#f6f3f2;border-left:1px solid rgba(0,0,0,0.1);overflow-y:auto;max-height:calc(100vh - 56px);}
.preview-header{padding:16px 24px;background:#f0ece9;border-bottom:1px solid rgba(76,59,55,0.1);display:flex;align-items:center;justify-content:space-between;}
.preview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:rgba(76,59,55,0.4);}
.preview-body{padding:32px 28px;}
.prev-title{font-family:'Fjalla One',sans-serif;font-size:24px;color:#1B1B1B;text-transform:uppercase;letter-spacing:0.93px;line-height:1.2;margin-bottom:8px;}
.prev-meta{font-size:13px;color:rgb(89,89,89);margin-bottom:20px;display:flex;gap:8px;align-items:center;}
.prev-meta .pipe{color:#ccc;}
.prev-hero{width:100%;height:180px;object-fit:cover;display:block;margin-bottom:20px;background:#ddd;}
.prev-hero-placeholder{width:100%;height:180px;background:linear-gradient(135deg,#e8e3e0,#d5cec9);display:flex;align-items:center;justify-content:center;margin-bottom:20px;text-align:center;padding:0 20px;}
.prev-hero-placeholder span{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:rgba(76,59,55,0.45);}
.prev-content{font-family:'Quicksand',sans-serif;font-size:14px;color:rgb(94,94,94);line-height:1.8;}
.prev-content p{margin-bottom:10px;}
.prev-content strong{font-weight:700;}

/* ── PUBLISH BAR ── */
.publish-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid rgba(0,0,0,0.08);padding:16px 48px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.publish-bar-left{display:flex;align-items:center;gap:12px;}
.delete-btn{padding:10px 20px;background:none;border:1px solid rgba(192,57,43,0.3);color:rgba(192,57,43,0.75);font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:all 0.2s;}
.delete-btn:hover{border-color:rgba(192,57,43,0.6);color:#c0392b;}
.save-btn{padding:10px 32px;background:#4C3B37;color:#fff;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2.5px;border:none;cursor:pointer;transition:all 0.2s;}
.save-btn:hover{background:#5c4840;}
.save-btn:disabled{opacity:0.4;cursor:not-allowed;}
.status-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:4px 12px;}
.status-pill.idle{color:rgba(0,0,0,0.35);}
.status-pill.saving{color:#ad7a1f;background:rgba(240,192,96,0.18);}
.status-pill.success{color:#2f7d4f;background:rgba(96,192,128,0.15);}
.status-pill.error{color:#c0392b;background:rgba(224,96,96,0.15);}

@media(max-width:1100px){
  .main{grid-template-columns:220px 1fr;}
  .preview-panel{display:none;}
}
@media(max-width:768px){
  .main{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .editor{padding:24px;}
  .publish-bar{padding:16px 24px;}
  .top-bar{padding:0 20px;}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-logo">Get Inspired Magazine</div>
    <h1 class="lock-title">Admin</h1>
    <p class="lock-sub">Enter password to continue</p>
    <input class="lock-input" id="pwInput" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="lock-btn" onclick="checkPassword()">Enter</button>
    <p class="lock-error" id="lockError"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <span class="top-bar-brand">Get Inspired — CMS</span>
    <div class="top-bar-right">
      <span class="top-bar-status" id="topStatus">Ready</span>
      <a href="index.html" class="top-bar-site" target="_blank">View Site ↗</a>
    </div>
  </div>

  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-section">
        <span class="sidebar-label">Posts</span>
        <div class="post-list" id="postList"></div>
      </div>
      <button class="new-post-btn" onclick="newPost()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6.5 1a.5.5 0 0 0-1 0v4.5H1a.5.5 0 0 0 0 1h4.5V11a.5.5 0 0 0 1 0V6.5H11a.5.5 0 0 0 0-1H6.5V1z"/></svg>
        New Post
      </button>
    </div>

    <!-- EDITOR -->
    <div class="editor" id="editorPanel">
      <span class="editor-eyebrow" id="editorEyebrow">New Post</span>

      <div class="field">
        <label class="field-label">Title</label>
        <input class="field-input title-input" id="fTitle" type="text" placeholder="Post title..." oninput="syncSlug(); updatePreview();">
        <div class="slug-preview">URL: blog-post.html?slug=<span id="slugPreview">—</span></div>
      </div>

      <div class="field field-row">
        <div>
          <label class="field-label">Date</label>
          <input class="field-input" id="fDate" type="text" placeholder="18 June 2026" oninput="updatePreview();">
        </div>
        <div>
          <label class="field-label">Categories</label>
          <div class="cats-wrap" id="catsWrap"></div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Excerpt <span class="field-hint">— shown on blog cards</span></label>
        <input class="field-input" id="fExcerpt" type="text" placeholder="Opening line or short teaser..." oninput="updatePreview();">
      </div>

      <div class="field">
        <label class="field-label">Hero Image <span class="field-hint">— full size, shown on the blog post page</span></label>
        <div class="img-upload-row">
          <label class="upload-btn" for="fHeroFile">Choose Image</label>
          <input type="file" id="fHeroFile" accept="image/*" style="display:none;" onchange="onFileSelected(this,'hero')">
          <span class="upload-hint" id="heroUploadHint">No image selected</span>
        </div>
        <span class="upload-note">JPG, PNG, or WEBP. Landscape, 1280px+ wide works best. Under 5MB.</span>
        <div class="img-preview-wrap" id="heroPreviewWrap" style="display:none;">
          <img class="img-preview-thumb" id="heroPreviewImg" src="" alt="">
          <button type="button" class="img-remove-btn" onclick="removeImage('hero')">Remove</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Thumbnail Image <span class="field-hint">— card image, optional, uses hero if left blank</span></label>
        <div class="img-upload-row">
          <label class="upload-btn" for="fThumbFile">Choose Image</label>
          <input type="file" id="fThumbFile" accept="image/*" style="display:none;" onchange="onFileSelected(this,'thumb')">
          <span class="upload-hint" id="thumbUploadHint">No image selected</span>
        </div>
        <div class="img-preview-wrap" id="thumbPreviewWrap" style="display:none;">
          <img class="img-preview-thumb" id="thumbPreviewImg" src="" alt="">
          <button type="button" class="img-remove-btn" onclick="removeImage('thumb')">Remove</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Content</label>
        <div class="rich-toolbar">
          <button class="rich-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
          <button class="rich-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
          <button class="rich-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
          <button class="rich-btn" onclick="fmt('insertUnorderedList')" title="Bullet list">• List</button>
          <button class="rich-btn" onclick="fmtBlock('p')" title="Paragraph">¶ Para</button>
          <button class="rich-btn" onclick="insertLink()" title="Link">🔗 Link</button>
        </div>
        <div class="rich-editor" id="fContent" contenteditable="true" oninput="updatePreview()"></div>
      </div>

      <div class="publish-bar">
        <div class="publish-bar-left">
          <button class="delete-btn" id="deleteBtn" onclick="deletePost()" style="display:none;">Delete Post</button>
          <span class="status-pill idle" id="statusPill">—</span>
        </div>
        <button class="save-btn" id="saveBtn" onclick="publishPost()">Publish</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-panel">
      <div class="preview-header">
        <span class="preview-label">Live Preview</span>
      </div>
      <div class="preview-body" id="previewBody">
        <div style="text-align:center;padding:60px 0;">
          <p style="font-size:12px;text-transform:uppercase;letter-spacing:2px;color:rgba(76,59,55,0.3);">Start typing to see preview</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG — hardcode your values here ──
var GH_TOKEN = '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';   // replace with your PAT
var GH_REPO  = 'Biege-Daemon/Get-Inspired'; // confirm repo name
var GH_FILE  = 'blogs.js';                  // path to blogs.js in repo
var GH_BRANCH = 'main';                     // or 'master' — check your repo
var GH_UPLOAD_DIR = 'uploads';              // folder in repo where images get committed
var ADMIN_PASSWORD = 'password';  // set your own admin password
var MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5MB

// ── STATE ──
var posts = [];
var currentSlug = null;
var allCategories = ['happiness', 'life']; // seed defaults
var heroFile = null, thumbFile = null;   // pending File objects, if a new image was picked
var heroUrl = '', thumbUrl = '';         // committed URLs (existing posts, or just-uploaded)

// ── LOCK ──
function checkPassword() {
  var val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
  }
}
document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

// ── INIT ──
function init() {
  setStatus('loading', 'Loading posts...');
  fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE + '?ref=' + GH_BRANCH, {
    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var content = atob(data.content.replace(/\n/g, ''));
    parseBlogsJS(content);
    renderSidebar();
    setStatus('idle', 'Ready');
    document.getElementById('fDate').value = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
    renderCats();
  })
  .catch(function(e) {
    setStatus('error', 'Failed to load. Check token/repo.');
  });
}

// ── PARSE blogs.js ──
function parseBlogsJS(src) {
  var match = src.match(/var BLOG_POSTS\s*=\s*(\[[\s\S]*?\]);/);
  if (!match) { posts = []; return; }
  try {
    posts = JSON.parse(match[1]);
    posts.forEach(function(p) {
      p.categories.forEach(function(c) {
        if (allCategories.indexOf(c) === -1) allCategories.push(c);
      });
    });
  } catch(e) {
    try {
      var arr = [];
      (new Function('arr', 'var BLOG_POSTS = ' + match[1] + '; arr.push.apply(arr, BLOG_POSTS);'))(arr);
      posts = arr;
    } catch(e2) { posts = []; }
  }
}

// ── BUILD blogs.js string ──
function buildBlogsJS() {
  var postsStr = posts.map(function(p) {
    return '  {\n'
      + '    slug: ' + JSON.stringify(p.slug) + ',\n'
      + '    title: ' + JSON.stringify(p.title) + ',\n'
      + '    date: ' + JSON.stringify(p.date) + ',\n'
      + '    categories: ' + JSON.stringify(p.categories) + ',\n'
      + '    excerpt: ' + JSON.stringify(p.excerpt) + ',\n'
      + '    thumb: ' + JSON.stringify(p.thumb) + ',\n'
      + '    hero: ' + JSON.stringify(p.hero) + ',\n'
      + '    content: `\n' + p.content + '\n    `\n'
      + '  }';
  }).join(',\n');

  return `// ── BLOGS.JS — Single source of truth for all blog posts
// To publish a new post: add one object to this array.

var BLOG_POSTS = [
${postsStr}
  // ── ADD NEW POSTS BELOW THIS LINE ──
];

function getPostBySlug(slug) {
  return BLOG_POSTS.find(function(p) { return p.slug === slug; }) || null;
}

function getCategoryLabel(cats) {
  return cats.map(function(c) {
    return c.charAt(0).toUpperCase() + c.slice(1);
  }).join(', ');
}

function renderBlogCards(container, posts) {
  container.innerHTML = posts.map(function(post) {
    return '<a href="blog-post.html?slug=' + post.slug + '" class="blog-card" data-categories="' + post.categories.join(' ') + '">'
      + '<div class="blog-card-img" style="background-image:url(\\'' + post.thumb + '\\');"></div>'
      + '<div class="blog-card-body">'
      +   '<div class="blog-meta"><span>' + post.date + '</span><span class="pipe">|</span><span>' + getCategoryLabel(post.categories) + '</span></div>'
      +   '<h4>' + post.title + '</h4>'
      +   '<p>' + post.excerpt + '</p>'
      +   '<span class="cont-reading">Continue Reading</span>'
      + '</div>'
      + '</a>';
  }).join('');
}

function renderBlogRows(container, posts) {
  var html = '';
  posts.forEach(function(post, i) {
    if (i > 0) html += '<hr class="blog-post-divider">';
    html += '<a href="blog-post.html?slug=' + post.slug + '" class="blog-post" data-cats="' + post.categories.join(' ') + '">'
      + '<div class="blog-post-row">'
      +   '<div class="blog-thumb" style="background-image:url(\\'' + post.thumb + '\\');"></div>'
      +   '<div class="blog-post-text">'
      +     '<div class="blog-post-meta"><span>' + post.date + '</span><span class="pipe">|</span><span>' + getCategoryLabel(post.categories) + '</span></div>'
      +     '<h4>' + post.title + '</h4>'
      +     '<p>' + post.excerpt + '</p>'
      +     '<span class="cont-reading">Continue Reading</span>'
      +   '</div>'
      + '</div>'
      + '</a>';
  });
  container.innerHTML = html;
}

function renderRecentPosts(container, currentSlug) {
  var recent = BLOG_POSTS.filter(function(p) { return p.slug !== currentSlug; }).slice(0, 5);
  container.innerHTML = recent.map(function(post) {
    return '<a href="blog-post.html?slug=' + post.slug + '" class="recent-post">'
      + '<div class="recent-post-thumb" style="background-image:url(\\'' + post.thumb + '\\');"></div>'
      + '<div class="recent-post-info"><p class="recent-post-title">' + post.title + '</p><p class="recent-post-date">' + post.date + '</p></div>'
      + '</a>';
  }).join('');
}
`;
}

// ── SIDEBAR ──
function renderSidebar() {
  var list = document.getElementById('postList');
  if (!posts.length) {
    list.innerHTML = '<div style="padding:12px 24px;font-size:12px;color:rgba(0,0,0,0.3);">No posts yet</div>';
    return;
  }
  list.innerHTML = posts.map(function(p) {
    return '<div class="post-item' + (p.slug === currentSlug ? ' active' : '') + '" onclick="loadPost(\'' + p.slug + '\')">'
      + '<div class="post-item-title">' + p.title + '</div>'
      + '<div class="post-item-meta">'
      +   '<span>' + p.date + '</span>'
      +   p.categories.map(function(c) { return '<span class="post-item-cat">' + c + '</span>'; }).join('')
      + '</div>'
      + '</div>';
  }).join('');
}

// ── LOAD POST INTO EDITOR ──
function loadPost(slug) {
  currentSlug = slug;
  var p = posts.find(function(x) { return x.slug === slug; });
  if (!p) return;

  document.getElementById('fTitle').value   = p.title;
  document.getElementById('fDate').value    = p.date;
  document.getElementById('fExcerpt').value = p.excerpt;

  heroFile = null; thumbFile = null;
  heroUrl = p.hero || '';
  thumbUrl = (p.thumb && p.thumb !== p.hero) ? p.thumb : '';

  document.getElementById('fHeroFile').value = '';
  document.getElementById('fThumbFile').value = '';
  setImagePreview('hero', heroUrl, heroUrl ? 'Current image' : 'No image selected');
  setImagePreview('thumb', thumbUrl, thumbUrl ? 'Current image' : 'No image selected');

  setContent(p.content.trim());
  document.getElementById('editorEyebrow').textContent = 'Editing Post';
  document.getElementById('deleteBtn').style.display = 'inline-block';
  document.getElementById('slugPreview').textContent = slug;
  allCategories = allCategories.concat(p.categories).filter(function(c, i, a) { return a.indexOf(c) === i; });
  renderCats(p.categories);
  renderSidebar();
  updatePreview();
}

// ── NEW POST ──
function newPost() {
  currentSlug = null;
  document.getElementById('fTitle').value   = '';
  document.getElementById('fDate').value    = new Date().toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'});
  document.getElementById('fExcerpt').value = '';

  heroFile = null; thumbFile = null; heroUrl = ''; thumbUrl = '';
  document.getElementById('fHeroFile').value = '';
  document.getElementById('fThumbFile').value = '';
  setImagePreview('hero', '', 'No image selected');
  setImagePreview('thumb', '', 'No image selected');

  setContent('');
  document.getElementById('editorEyebrow').textContent = 'New Post';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('slugPreview').textContent = '—';
  renderCats([]);
  renderSidebar();
  updatePreview();
  document.getElementById('fTitle').focus();
}

// ── SLUG ──
function toSlug(str) {
  return str.toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
}
function syncSlug() {
  if (!currentSlug) {
    document.getElementById('slugPreview').textContent = toSlug(document.getElementById('fTitle').value) || '—';
  }
}

// ── CATEGORIES ──
var selectedCats = [];
function renderCats(selected) {
  if (selected !== undefined) selectedCats = selected.slice();
  var wrap = document.getElementById('catsWrap');
  wrap.innerHTML = allCategories.map(function(c) {
    return '<button class="cat-chip' + (selectedCats.indexOf(c) !== -1 ? ' selected' : '') + '" onclick="toggleCat(\'' + c + '\')">' + c + '</button>';
  }).join('') + '<button class="cat-chip-add" onclick="addNewCat()">+ New</button>';
}
function toggleCat(c) {
  var i = selectedCats.indexOf(c);
  if (i === -1) selectedCats.push(c); else selectedCats.splice(i, 1);
  renderCats();
  updatePreview();
}
function addNewCat() {
  var wrap = document.getElementById('catsWrap');
  var inp = document.createElement('input');
  inp.className = 'cat-new-input';
  inp.placeholder = 'category';
  wrap.appendChild(inp);
  inp.focus();
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var v = inp.value.trim().toLowerCase();
      if (v && allCategories.indexOf(v) === -1) allCategories.push(v);
      if (v) { selectedCats.push(v); }
      renderCats();
    }
    if (e.key === 'Escape') renderCats();
  });
  inp.addEventListener('blur', function() {
    var v = inp.value.trim().toLowerCase();
    if (v && allCategories.indexOf(v) === -1) allCategories.push(v);
    if (v) selectedCats.push(v);
    renderCats();
  });
}

// ── RICH EDITOR ──
function fmt(cmd) {
  document.getElementById('fContent').focus();
  document.execCommand(cmd, false, null);
  updatePreview();
}
function fmtBlock(tag) {
  document.getElementById('fContent').focus();
  document.execCommand('formatBlock', false, tag);
  updatePreview();
}
function insertLink() {
  var url = prompt('Enter URL:');
  if (url) {
    document.getElementById('fContent').focus();
    document.execCommand('createLink', false, url);
    updatePreview();
  }
}
function getContent() { return document.getElementById('fContent').innerHTML.trim(); }
function setContent(html) { document.getElementById('fContent').innerHTML = html || ''; }

// ── IMAGE UPLOAD HANDLING ──
function setImagePreview(kind, src, hintText) {
  var imgId  = kind === 'hero' ? 'heroPreviewImg'  : 'thumbPreviewImg';
  var wrapId = kind === 'hero' ? 'heroPreviewWrap' : 'thumbPreviewWrap';
  var hintId = kind === 'hero' ? 'heroUploadHint'  : 'thumbUploadHint';
  document.getElementById(hintId).textContent = hintText;
  if (src) {
    document.getElementById(imgId).src = src;
    document.getElementById(wrapId).style.display = 'flex';
  } else {
    document.getElementById(wrapId).style.display = 'none';
  }
}

function onFileSelected(input, kind) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) {
    alert('Please select an image file.');
    input.value = '';
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    alert('Image must be under ' + (MAX_IMAGE_BYTES / (1024*1024)) + 'MB.');
    input.value = '';
    return;
  }
  if (kind === 'hero') heroFile = file; else thumbFile = file;
  var blobUrl = URL.createObjectURL(file);
  setImagePreview(kind, blobUrl, file.name + ' (' + Math.round(file.size / 1024) + ' KB)');
  updatePreview();
}

function removeImage(kind) {
  if (kind === 'hero') {
    heroFile = null; heroUrl = '';
    document.getElementById('fHeroFile').value = '';
  } else {
    thumbFile = null; thumbUrl = '';
    document.getElementById('fThumbFile').value = '';
  }
  setImagePreview(kind, '', 'No image selected');
  updatePreview();
}

function currentHeroSrc() {
  if (heroFile) {
    var img = document.getElementById('heroPreviewImg');
    return img ? img.src : '';
  }
  return heroUrl;
}
function currentThumbSrc() {
  if (thumbFile) {
    var img = document.getElementById('thumbPreviewImg');
    return img ? img.src : '';
  }
  return thumbUrl || currentHeroSrc();
}

function sanitizeFilename(name) {
  return name.toLowerCase().replace(/[^a-z0-9.\-]/g, '-').replace(/-+/g, '-');
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() {
      var result = reader.result;
      resolve(result.substring(result.indexOf(',') + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Commits an image file into the repo and returns its public raw URL.
function uploadImageToGitHub(file) {
  return fileToBase64(file).then(function(base64) {
    var path = GH_UPLOAD_DIR + '/' + Date.now() + '-' + sanitizeFilename(file.name);
    return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + GH_TOKEN,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Upload image: ' + path,
        content: base64,
        branch: GH_BRANCH
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.content) throw new Error(data.message || 'Image upload failed');
      return 'https://raw.githubusercontent.com/' + GH_REPO + '/' + GH_BRANCH + '/' + path;
    });
  });
}

// ── PREVIEW ──
function updatePreview() {
  var title   = document.getElementById('fTitle').value   || 'Post Title';
  var date    = document.getElementById('fDate').value    || '—';
  var hero    = currentHeroSrc();
  var content = getContent();
  var cats    = selectedCats.length ? selectedCats.map(function(c){ return c.charAt(0).toUpperCase()+c.slice(1); }).join(', ') : '—';

  var heroHtml = hero
    ? '<img class="prev-hero" id="previewHeroImg" src="' + hero + '" alt="">'
    : '<div class="prev-hero-placeholder"><span>Hero Image</span></div>';

  document.getElementById('previewBody').innerHTML =
    '<p class="prev-meta"><span>' + date + '</span><span class="pipe">|</span><span>' + cats + '</span></p>'
    + '<h2 class="prev-title">' + title + '</h2>'
    + heroHtml
    + '<div class="prev-content">' + (content || '<p style="color:#bbb;font-style:italic;">Content will appear here...</p>') + '</div>';

  var imgEl = document.getElementById('previewHeroImg');
  if (imgEl) {
    imgEl.addEventListener('error', function() {
      imgEl.outerHTML = '<div class="prev-hero-placeholder"><span>⚠ Image failed to load</span></div>';
    });
  }
}

// ── PUBLISH ──
function publishPost() {
  var title   = document.getElementById('fTitle').value.trim();
  var date    = document.getElementById('fDate').value.trim();
  var excerpt = document.getElementById('fExcerpt').value.trim();
  var content = getContent();
  var slug    = currentSlug || toSlug(title);

  if (!title)   { alert('Title is required.'); return; }
  if (!slug)    { alert('Could not generate slug from title.'); return; }
  if (!content) { alert('Content is required.'); return; }
  if (!selectedCats.length) { alert('Select at least one category.'); return; }
  if (!heroFile && !heroUrl) { alert('Please upload a hero image.'); return; }

  document.getElementById('saveBtn').disabled = true;
  setStatus('saving', 'Uploading image(s)...');
  document.getElementById('topStatus').textContent = 'Uploading image(s)...';

  var heroPromise  = heroFile  ? uploadImageToGitHub(heroFile)  : Promise.resolve(heroUrl);
  var thumbPromise = thumbFile ? uploadImageToGitHub(thumbFile) : Promise.resolve(thumbUrl);

  Promise.all([heroPromise, thumbPromise]).then(function(results) {
    var hero  = results[0];
    var thumb = results[1] || hero;

    // Persist the resolved URLs so further edits in this session don't re-upload.
    heroUrl = hero; thumbUrl = results[1] ? thumb : '';
    heroFile = null; thumbFile = null;

    var post = { slug: slug, title: title, date: date, categories: selectedCats.slice(), excerpt: excerpt, thumb: thumb, hero: hero, content: '\n      ' + content + '\n    ' };
    var idx = posts.findIndex(function(p) { return p.slug === slug; });
    if (idx !== -1) posts[idx] = post; else posts.push(post);
    currentSlug = slug;

    commitToGitHub();
  }).catch(function(e) {
    setStatus('error', 'Error: ' + e.message);
    document.getElementById('topStatus').textContent = 'Upload failed';
    document.getElementById('saveBtn').disabled = false;
  });
}

// ── DELETE ──
function deletePost() {
  if (!currentSlug) return;
  if (!confirm('Delete "' + currentSlug + '"? This cannot be undone.')) return;
  posts = posts.filter(function(p) { return p.slug !== currentSlug; });
  currentSlug = null;
  commitToGitHub(true);
}

// ── GITHUB COMMIT (blogs.js) ──
function commitToGitHub(isDelete) {
  setStatus('saving', 'Publishing...');
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('topStatus').textContent = 'Publishing...';

  fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE + '?ref=' + GH_BRANCH, {
    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var sha = data.sha;
    var newContent = buildBlogsJS();
    var encoded = btoa(unescape(encodeURIComponent(newContent)));
    var message = isDelete ? 'Delete post via admin' : 'Publish post: ' + document.getElementById('fTitle').value.trim();

    return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + GH_TOKEN,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: message, content: encoded, sha: sha, branch: GH_BRANCH })
    });
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.content) {
      setStatus('success', 'Published ✓');
      document.getElementById('topStatus').textContent = 'Published — Vercel deploying...';
      renderSidebar();
      if (isDelete) newPost();
      setTimeout(function() {
        setStatus('idle', '—');
        document.getElementById('topStatus').textContent = 'Ready';
      }, 4000);
    } else {
      throw new Error(data.message || 'Commit failed');
    }
  })
  .catch(function(e) {
    setStatus('error', 'Error: ' + e.message);
    document.getElementById('topStatus').textContent = 'Publish failed';
  })
  .finally(function() {
    document.getElementById('saveBtn').disabled = false;
  });
}

// ── STATUS ──
function setStatus(type, msg) {
  var pill = document.getElementById('statusPill');
  pill.className = 'status-pill ' + type;
  pill.textContent = msg;
}

// Init cats with defaults
renderCats([]);
</script>
